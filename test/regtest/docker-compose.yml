# XS Wallet - Regtest/Testnet Environment
#
# Minimal setup with just bitcoind for local testing.
# Boltz API is used remotely (testnet.boltz.exchange)
#
# Usage:
#   docker compose up -d
#   cd core && .\xscore.exe --network=testnet

services:
  # ============================================================================
  # Bitcoin Core (Testnet)
  # ============================================================================
  bitcoind:
    image: lncm/bitcoind:v27.0
    container_name: xs-bitcoind-testnet
    command:
      - -testnet
      - -server
      - -rpcuser=rpcuser
      - -rpcpassword=rpcpass
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -txindex=1
    ports:
      - "18332:18332" # RPC (testnet)
      - "18333:18333" # P2P (testnet)
      - "28332:28332" # ZMQ blocks
      - "28333:28333" # ZMQ tx
    volumes:
      - bitcoin_data:/home/bitcoin/.bitcoin
    healthcheck:
      test: [ "CMD", "bitcoin-cli", "-testnet", "-rpcuser=rpcuser", "-rpcpassword=rpcpass", "getblockchaininfo" ]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  bitcoin_data:
