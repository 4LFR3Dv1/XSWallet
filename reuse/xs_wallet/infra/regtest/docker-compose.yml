# DomniWallet - Regtest Stack (BTC + Liquid)
# Minimal dev environment for local testing.
#
# Usage:
#   1. Copy .env.example to .env and configure
#   2. docker compose up -d
#
# Note: Tron node is external by default. Configure TRON_RPC_URL in the app.

services:
  postgres:
    image: postgres:16-alpine
    container_name: domni-postgres-regtest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PG_USER:-domni}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-domni_regtest_pw}
      - POSTGRES_DB=${PG_DB:-domniwallet}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - domni-regtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-domni} -d ${PG_DB:-domniwallet}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bitcoind:
    image: ruimarinho/bitcoin-core:alpine
    container_name: domni-bitcoind-regtest
    restart: unless-stopped
    command:
      - -server=1
      - -chain=${BITCOIN_NETWORK:-regtest}
      - -txindex=${BITCOIN_TXINDEX:-1}
      - -par=${BITCOIN_PARALLEL_CORE:-0}
      - -dbcache=${BITCOIN_DBCACHE_RAM_MB:-450}
      - -maxconnections=${BITCOIN_MAX_CONNECTIONS:-40}
      - -prune=${BITCOIN_PRUNE:-0}
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=${BITCOIN_RPC_USER}
      - -rpcpassword=${BITCOIN_RPC_PASSWORD}
      - -zmqpubrawblock=tcp://0.0.0.0:${BITCOIN_ZMQ_BLOCK_PORT:-28332}
      - -zmqpubrawtx=tcp://0.0.0.0:${BITCOIN_ZMQ_TX_PORT:-28333}
      - -bind=0.0.0.0
    ports:
      - "${BITCOIN_RPC_PORT:-18443}:18443"
      - "${BITCOIN_P2P_PORT:-18444}:18444"
      - "${BITCOIN_ZMQ_BLOCK_PORT:-28332}:28332"
      - "${BITCOIN_ZMQ_TX_PORT:-28333}:28333"
    volumes:
      - bitcoind-data:/home/bitcoin/.bitcoin
    networks:
      - domni-regtest
    healthcheck:
      test: [ "CMD", "bitcoin-cli", "-chain=${BITCOIN_NETWORK:-regtest}", "-rpcuser=${BITCOIN_RPC_USER}", "-rpcpassword=${BITCOIN_RPC_PASSWORD}", "getblockchaininfo" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 20s

  elements:
    image: ghcr.io/vulpemventures/elements:latest
    container_name: domni-elements-regtest
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_healthy
    command:
      - -mainchainrpcuser=${BITCOIN_RPC_USER}
      - -mainchainrpcpassword=${BITCOIN_RPC_PASSWORD}
      - -mainchainrpcport=${BITCOIN_RPC_PORT:-18443}
      - -mainchainrpchost=bitcoind
      - -chain=${ELEMENTS_NETWORK:-liquidregtest}
      - -listen=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcport=${ELEMENTS_RPC_PORT:-18884}
      - -rpcuser=${ELEMENTS_RPC_USER}
      - -rpcpassword=${ELEMENTS_RPC_PASSWORD}
      - -txindex=${ELEMENTS_TXINDEX:-1}
      - -prune=${ELEMENTS_PRUNE:-0}
      - -bind=0.0.0.0
    ports:
      - "${ELEMENTS_RPC_PORT:-18884}:18884"
      - "${ELEMENTS_P2P_PORT:-18886}:18886"
    volumes:
      - elements-data:/root/.elements
    networks:
      - domni-regtest

  wallet-service:
    build:
      context: ../../../../wallet-service
      dockerfile: Dockerfile
    container_name: domni-wallet-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bitcoind:
        condition: service_healthy
      elements:
        condition: service_started
    environment:
      - WALLET_DB_DSN=postgres://${PG_USER:-domni}:${PG_PASSWORD:-domni_regtest_pw}@postgres:5432/${PG_DB:-domniwallet}?sslmode=disable
      - WALLET_HTTP_ADDR=:8081
      - WALLET_INTERNAL_TOKEN=${WALLET_INTERNAL_TOKEN:-}
      - BTC_RPC_URL=http://bitcoind:${BITCOIN_RPC_PORT:-18443}
      - BTC_RPC_USER=${BITCOIN_RPC_USER}
      - BTC_RPC_PASS=${BITCOIN_RPC_PASSWORD}
      - BTC_RPC_WALLET=${BTC_RPC_WALLET:-domniwallet}
      - LIQUID_RPC_URL=http://elements:${ELEMENTS_RPC_PORT:-18884}
      - LIQUID_RPC_USER=${ELEMENTS_RPC_USER}
      - LIQUID_RPC_PASS=${ELEMENTS_RPC_PASSWORD}
    ports:
      - "8081:8081"
    networks:
      - domni-regtest

  payout-service:
    build:
      context: ../../../../
      dockerfile: payout-service/Dockerfile
    container_name: domni-payout-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      bitcoind:
        condition: service_healthy
      wallet-service:
        condition: service_started
    environment:
      - PAYOUT_DB_DSN=postgres://${PG_USER:-domni}:${PG_PASSWORD:-domni_regtest_pw}@postgres:5432/${PG_DB:-domniwallet}?sslmode=disable
      - PAYOUT_HTTP_ADDR=:8090
      - WALLET_SERVICE_URL=http://wallet-service:8081
      - WALLET_INTERNAL_TOKEN=${WALLET_INTERNAL_TOKEN:-}
      - BTC_RPC_URL=http://bitcoind:${BITCOIN_RPC_PORT:-18443}
      - BTC_RPC_USER=${BITCOIN_RPC_USER}
      - BTC_RPC_PASS=${BITCOIN_RPC_PASSWORD}
      - BTC_RPC_WALLET=${BTC_RPC_WALLET:-domniwallet}
      - BTC_NETWORK=${BITCOIN_NETWORK:-regtest}
      - PAYOUT_BTC_CONFIRMATIONS=${PAYOUT_BTC_CONFIRMATIONS:-1}
      - PAYOUT_FEE_FALLBACK_SATVB=${PAYOUT_FEE_FALLBACK_SATVB:-10}
      - PAYOUT_WORKER_INTERVAL=${PAYOUT_WORKER_INTERVAL:-2s}
      - PAYOUT_MAX_ATTEMPTS=${PAYOUT_MAX_ATTEMPTS:-3}
      - PAYOUT_CIRCUIT_FAILURE_THRESHOLD=${PAYOUT_CIRCUIT_FAILURE_THRESHOLD:-5}
      - PAYOUT_CIRCUIT_OPEN_DURATION=${PAYOUT_CIRCUIT_OPEN_DURATION:-60s}
    ports:
      - "8090:8090"
    networks:
      - domni-regtest

networks:
  domni-regtest:
    driver: bridge

volumes:
  bitcoind-data:
  elements-data:
  postgres-data:
