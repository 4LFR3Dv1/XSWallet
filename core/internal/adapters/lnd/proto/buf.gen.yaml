# Buf configuration for protobuf code generation
# Run: buf generate
version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/xs-wallet/xscore/internal/adapters/lnd/gen
plugins:
  - name: go
    out: gen
    opt: paths=source_relative
  - name: go-grpc
    out: gen
    opt: paths=source_relative
